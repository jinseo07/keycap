<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061116">
<meta name="description" content="누르고, 유지하고, 놓는 순서를 푸는 다섯 단계 키보드 논리 퍼즐."><title>KEY / HOLD — 키보드 논리 퍼즐</title>
<style>
:root{color-scheme:dark;--bg:#061116;--panel:#0a1b22;--line:#29404a;--muted:#82969c;--ink:#e6f0f0;--mint:#b7f2df;--mint2:#6fdcbe;--gold:#edd78f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 24%,#10313a66,transparent 45%),radial-gradient(circle at 14% 25%,#0b2e3944,transparent 22%),#061116;color:var(--ink);font:15px/1.5 Inter,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}button{font:inherit;color:inherit}
.shell{max-width:1120px;min-height:100vh;margin:auto;padding:18px 30px 28px;display:flex;flex-direction:column}.top{height:38px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.18em}.brand{color:var(--ink);font-weight:750;display:flex;align-items:center;gap:9px}.mark{width:22px;height:22px;border:1px solid var(--mint2);border-radius:6px;display:grid;place-items:center;color:var(--mint);font-size:13px}.top button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;letter-spacing:.1em}.top button:hover{color:var(--mint)}
main{flex:1;display:flex;flex-direction:column;justify-content:center}.intro,.game,.below{width:min(850px,100%);margin-left:auto;margin-right:auto}.intro{display:flex;justify-content:space-between;align-items:end;margin-top:14px;margin-bottom:14px}.eye{font-size:10px;letter-spacing:.24em;color:var(--mint2);text-transform:uppercase}.intro h1{font-size:clamp(26px,4vw,40px);line-height:1.1;letter-spacing:-.05em;margin:5px 0 0;font-weight:650}.intro p{font-size:12px;color:#91a4aa;margin:8px 0 0}.count{text-align:right;color:var(--muted);font-size:10px;letter-spacing:.1em}.count strong{display:block;color:var(--ink);font:23px ui-monospace,monospace}
.game{background:linear-gradient(150deg,#0a1a20ef,#08151bf2);border:1px solid #1a343e;border-radius:15px;overflow:hidden;box-shadow:0 20px 70px #0005}.head{padding:15px 21px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b3139}.heading{display:flex;align-items:center;gap:10px}.number{font:11px ui-monospace,monospace;color:var(--mint);border:1px solid #315b5b;border-radius:5px;padding:4px 7px}.heading h2{font-size:14px;margin:0;font-weight:600}.tag{font-size:9px;letter-spacing:.11em;color:var(--muted)}.head button,.tools button{background:none;border:0;color:#9aadb0;font-size:10px;cursor:pointer}.head button:hover,.tools button:hover{color:var(--mint)}
.tabs{display:flex;gap:6px;padding:11px 21px 0}.tab{width:29px;height:25px;background:#0c1c22;border:1px solid #263c43;border-radius:5px;color:#81969d;font:10px ui-monospace,monospace;cursor:pointer}.tab[aria-current=true]{border-color:var(--mint2);color:var(--mint);background:#17332f}.tab:disabled{opacity:.35;cursor:not-allowed}.tab.done{color:var(--gold)}
.field{min-height:195px;display:grid;grid-template-columns:1fr 150px;align-items:center;padding:17px 32px;position:relative}.field:after{content:"";position:absolute;bottom:8px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,#78909a33,transparent)}.goalbox{text-align:center}.label{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-bottom:12px}.goal{display:flex;justify-content:center;align-items:center;gap:10px;min-height:45px}.cap{height:40px;min-width:43px;display:grid;place-items:center;padding:0 8px;border:1px solid #40565d;border-bottom-width:2px;border-radius:5px;background:linear-gradient(#10242b,#0b1a20);color:#d8e3e3;font:13px ui-monospace,monospace;cursor:pointer;user-select:none;touch-action:none;transition:.1s}.cap:hover{border-color:#9ad7c6;color:#fff}.cap.held{background:linear-gradient(#327465,#1b5049);border-color:#9be5d0;color:#effff8;box-shadow:0 0 14px #5ce0bd22}.cap.goalkey{border-color:#c8b77a;color:#f0df9b}.cap.goalkey.held{border-color:#f3d779}.plus{color:#6f878d}.note{font-size:11px;color:#a6b8b9;margin-top:9px}.rule{font-size:10px;color:#c4d3d2;margin:8px auto 0;max-width:600px}.status{height:17px;margin-top:4px;color:var(--mint2);font-size:10px}.trail{border-left:1px solid #223840;padding-left:16px;min-height:74px}.trailtitle{font-size:8px;letter-spacing:.17em;color:#71868d;margin:0 0 8px}.trail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font:10px ui-monospace,monospace;color:#809399}.trail li:first-child{color:var(--mint)}.trail .empty{color:#52666c}
.keyboard{padding:4px 20px 14px;display:flex;flex-direction:column;gap:5px}.row{display:flex;justify-content:center;gap:4px}.key{height:33px;min-width:clamp(24px,4vw,35px);padding:0 6px;font-size:11px}.space{min-width:180px}.foot{padding:0 21px 15px}.progressmeta{display:flex;justify-content:space-between;color:#91a4aa;font-size:9px;margin-bottom:6px}.progressmeta strong{color:var(--ink);font:10px ui-monospace,monospace}.bar{height:4px;background:#13262d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#70cdb3,#d1f3d7);transition:width .25s}.footline{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.hint{color:#748990;font-size:9px}.tools{display:flex;gap:8px}.tools button{border:1px solid #29424a;border-radius:5px;padding:5px 9px;background:#10232a;font-size:9px}.tools .next{background:var(--mint);border-color:var(--mint);color:#10241f;font-weight:700}.below{display:flex;justify-content:space-between;align-items:center;color:#758990;font-size:9px;margin-top:10px}.legend{display:flex;gap:13px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:var(--mint2)}.dot.gold{background:var(--gold)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);opacity:0;transition:.2s;background:#163a36;border:1px solid #367e6b;border-radius:8px;padding:8px 13px;font-size:11px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.shell{padding:10px 10px 20px}.intro{margin-top:19px}.intro p{max-width:260px}.head{padding:12px 13px}.tabs{padding-left:13px}.field{grid-template-columns:1fr;min-height:185px;padding:20px 10px}.trail{display:none}.keyboard{padding:4px 6px 13px;gap:4px}.row{gap:2px}.key{height:30px;min-width:clamp(20px,6.2vw,33px);padding:0 2px;font-size:10px}.space{min-width:clamp(100px,31vw,180px)}.foot{padding:0 13px 12px}.hint{max-width:42%}.tag{font-size:8px}.heading h2{font-size:12px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="mark">⌘</span> KEY / HOLD</div><div>LOGIC STUDY 01 <button id="help">HOW TO PLAY</button></div></header>
<main>
<section class="intro"><div><div class="eye">A small puzzle about letting go</div><h1>손가락의 순서를 설계하세요.</h1><p>목표 조합을 보고, 키를 누르고 유지하고 놓는 순서를 푸세요. 속도는 필요 없어요.</p></div><div class="count"><strong id="count">01 / 05</strong>PUZZLE SET</div></section>
<section class="game">
<div class="head"><div class="heading"><span class="number" id="num">01</span><div><h2 id="title">첫 번째 고리</h2><span class="tag" id="tag"></span></div></div><button id="restart" title="현재 퍼즐 다시 시작">↺ 다시 시작</button></div>
<nav class="tabs" id="tabs" aria-label="퍼즐 단계"></nav>
<div class="field"><div class="goalbox"><div class="label">완성할 키 조합</div><div class="goal" id="goal"></div><div class="note" id="note"></div><div class="rule" id="rule"></div><div class="status" id="status" aria-live="polite"></div></div><aside class="trail"><p class="trailtitle">INPUT TRACE</p><ul id="trace"></ul></aside></div>
<div class="keyboard" id="keyboard" aria-label="가상 키보드"></div>
<div class="foot"><div class="progressmeta"><span id="diff"></span><strong id="moves">0 ACTIONS</strong></div><div class="bar"><i id="bar"></i></div><div class="footline"><span class="hint" id="hint">화면 키를 누르거나 실제 키보드를 사용하세요.</span><div class="tools"><button id="undo">한 수 되돌리기</button><button class="next" id="next" hidden>다음 퍼즐 →</button></div></div></div>
</section>
<div class="below"><div class="legend"><span><i class="dot"></i> 눌린 키</span><span><i class="dot gold"></i> 목표 키</span></div><span>PRESS AND HOLD · NO TIMER</span></div>
</main></div>
<div class="toast" id="toast"></div>
<script>
(()=> {
const levels=[
 {title:"첫 번째 고리",tag:"HOLD · PRESS AND KEEP",difficulty:"01 · BEGINNER",start:[],goal:["F","J"],keys:["F","J"],hint:"F를 누른 채 J를 누르면 두 키가 함께 유지됩니다.",rules:["P:F","P:J"],success:"좋아요. 한 키를 유지한 채 다른 키에 도달했어요."},
 {title:"놓는 타이밍",tag:"RELEASE · ORDER MATTERS",difficulty:"02 · EASY",start:["F"],goal:["J"],keys:["F","J"],hint:"F는 이미 눌려 있어요. J를 누른 채 F를 놓으세요.",rules:["P:J","R:F"],success:"놓는 순간까지 계획했어요."},
 {title:"문을 통과하는 순서",tag:"SEQUENCE · RELEASE ORDER",difficulty:"03 · NORMAL",start:["C"],goal:["D","K"],keys:["C","D","K"],hint:"C가 눌려 있을 때 D, 다음 C를 놓고 마지막으로 K.",rules:["P:D","R:C","P:K"],success:"정해진 누르기와 놓기 순서를 지켰어요."},
 {title:"다리 놓기",tag:"BRIDGE · RELEASE TO MOVE",difficulty:"04 · ADVANCED",start:["A"],goal:["L"],keys:["A","S","L"],hint:"S를 A와 함께 누르세요. A를 놓고 L을 누른 다음 S를 놓으세요.",rules:["P:S","R:A","P:L","R:S"],success:"다리를 건너고 나서 놓았어요."},
 {title:"손가락 연쇄",tag:"CHAIN · THREE-KEY BRIDGE",difficulty:"05 · EXPERT",start:["F"],goal:[";"],keys:["F","J","K",";"],hint:"다음 키를 먼저 눌러 겹치세요: F → J → K → ;. 세 키가 겹친 뒤 F를 놓고, 마지막 키만 남기세요.",rules:["P:J","P:K","R:F","P:;","R:J","R:K"],success:"연쇄 완료. 세 키를 겹쳐 유지하고 마지막 키만 남겼어요."}
];
const MAX_HELD_KEYS=10;
const rows=[["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L",";"],["Z","X","C","V","B","N","M",",",".","/"]];
const $=id=>document.getElementById(id);let ix=0,solved=new Set(),history=[],pressed=new Set(),pointerHeld=new Map(),buttonHeld=new Map(),state,toastTimer;
function fresh(){state={held:[...levels[ix].start],step:0,actions:0,done:false};history=[];pressed.clear();$("status").textContent="";render()}
function say(s){$("status").textContent=s}
function act(type,key){key=key.toUpperCase();const l=levels[ix],token=(type==="press"?"P:":"R:")+key;if(state.done||!l.keys.includes(key))return;
const held=state.held.includes(key);if(type==="press"&&held||type==="release"&&!held)return;
if(l.rules[state.step]!==token){say(type==="press"?key+"를 지금 누르면 규칙에 맞지 않아요.":key+"를 아직 놓을 수 없어요.");return}
if(type==="press"&&state.held.length>=MAX_HELD_KEYS){say("동시에 유지할 수 있는 키는 최대 "+MAX_HELD_KEYS+"개예요.");return}
history.push(JSON.parse(JSON.stringify(state)));if(type==="press")state.held.push(key);else state.held=state.held.filter(x=>x!==key);state.step++;state.actions++;say(type==="press"?key+" 누름 · 유지 중":key+" 놓음");
if(state.step===l.rules.length&&l.goal.length===state.held.length&&l.goal.every(x=>state.held.includes(x))){state.done=true;solved.add(ix);say(l.success);$("hint").textContent=l.success;toast("퍼즐 해결! "+l.success)}
render()}
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1500)}
function select(n){if(n>solved.size||n<0||n>=levels.length)return;ix=n;fresh()}
function keyButton(k,goal=false){const b=document.createElement("button");b.className="cap "+(goal?"goalkey ":"")+(state.held.includes(k)?"held":"");b.textContent=k;b.type="button";b.dataset.key=k;b.setAttribute("aria-pressed",String(state.held.includes(k)));return b}
function render(){const l=levels[ix];$("count").textContent=String(ix+1).padStart(2,"0")+" / 05";$("num").textContent=String(ix+1).padStart(2,"0");$("title").textContent=l.title;$("tag").textContent=l.tag;$("diff").textContent="PUZZLE "+String(ix+1).padStart(2,"0")+" · "+l.difficulty;$("moves").textContent=state.actions+" ACTION"+(state.actions===1?"":"S");$("bar").style.width=(solved.size*20)+"%";$("hint").textContent=l.hint;$("goal").replaceChildren();l.goal.forEach((k,i)=>{$("goal").append(keyButton(k,true));if(i<l.goal.length-1){const p=document.createElement("span");p.className="plus";p.textContent="+";$("goal").append(p)}});$("note").textContent="눌린 키 "+(state.held.length?state.held.join(" + "):"없음")+" · 동시에 최대 "+MAX_HELD_KEYS+"개 유지";$("rule").textContent=state.done?"모든 규칙 완료 · 목표 조합 완성":"규칙 "+(state.step+1)+" / "+l.rules.length+" · 키를 놓는 순간도 입력으로 셉니다";
$("tabs").replaceChildren();levels.forEach((x,i)=>{const b=document.createElement("button");b.className="tab "+(solved.has(i)?"done":"");b.textContent=String(i+1).padStart(2,"0");b.disabled=i>solved.size;b.setAttribute("aria-current",String(i===ix));b.addEventListener("click",()=>select(i));$("tabs").append(b)});
const kb=$("keyboard");kb.replaceChildren();rows.forEach(row=>{const r=document.createElement("div");r.className="row";row.forEach(k=>{const b=keyButton(k,l.goal.includes(k));b.classList.add("key");r.append(b)});kb.append(r)});const r=document.createElement("div");r.className="row";const sp=keyButton("SPACE");sp.textContent="SPACE";sp.classList.add("key","space");r.append(sp);kb.append(r);
$("trace").replaceChildren();const acts=history.map((before,i)=>{const after=i+1<history.length?history[i+1]:state;const all=[...new Set([...before.held,...after.held])];const key=all.find(x=>before.held.includes(x)!==after.held.includes(x));return (after.held.includes(key)?"↓ ":"↑ ")+key});if(!acts.length){const li=document.createElement("li");li.className="empty";li.textContent="아직 입력이 없어요";$("trace").append(li)}else acts.slice(-6).forEach(x=>{const li=document.createElement("li");li.textContent=x;$("trace").prepend(li)});
$("undo").disabled=!history.length||state.done;$("next").hidden=!state.done||ix===levels.length-1;$("next").onclick=()=>select(ix+1)}
$("restart").onclick=fresh;$("undo").onclick=()=>{if(!history.length||state.done)return;state=history.pop();say("한 수 되돌렸어요.");render()};
function hasInputSource(k){return pressed.has(k)||[...pointerHeld.values()].includes(k)||[...buttonHeld.values()].includes(k)}
function releaseWhenUnheld(k){if(state.held.includes(k)&&!hasInputSource(k))act("release",k)}
function finishPointer(e){const k=pointerHeld.get(e.pointerId);if(!k)return;pointerHeld.delete(e.pointerId);releaseWhenUnheld(k)}
document.addEventListener("pointerdown",e=>{const cap=e.target.closest?.(".cap");if(!cap)return;const k=cap.dataset.key;if(!levels[ix].keys.includes(k))return;e.preventDefault();pointerHeld.set(e.pointerId,k);try{document.body.setPointerCapture(e.pointerId)}catch{}if(!state.held.includes(k))act("press",k)});
document.addEventListener("pointerup",finishPointer);document.addEventListener("pointercancel",finishPointer);document.addEventListener("lostpointercapture",finishPointer);
document.addEventListener("keydown",e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const cap=e.target.closest?.(".cap");if(cap&&(e.key===" "||e.key==="Enter")){e.preventDefault();buttonHeld.set(e.code,cap.dataset.key);if(!state.held.includes(cap.dataset.key))act("press",cap.dataset.key);return}const k=e.key===" "?"SPACE":e.key.toUpperCase();if(levels[ix].keys.includes(k)){e.preventDefault();pressed.add(k);if(!state.held.includes(k))act("press",k)}});
document.addEventListener("keyup",e=>{if(buttonHeld.has(e.code)){const k=buttonHeld.get(e.code);buttonHeld.delete(e.code);releaseWhenUnheld(k);return}const k=e.key===" "?"SPACE":e.key.toUpperCase();if(pressed.has(k)){pressed.delete(k);releaseWhenUnheld(k)}});
window.addEventListener("blur",()=>{const hadInput=pressed.size||pointerHeld.size||buttonHeld.size;pressed.clear();pointerHeld.clear();buttonHeld.clear();if(hadInput&&!state.done){fresh();say("창을 벗어나 입력을 초기화했어요. 현재 퍼즐을 다시 시작하세요.");render()}});
$("help").onclick=()=>alert("목표 키 조합과 규칙을 확인하세요. 화면 키캡이나 실제 키보드를 누르고 있는 동안 키가 유지되고, 떼면 해제됩니다. 잘못된 행동은 상태를 바꾸지 않으며, 동시에 최대 "+MAX_HELD_KEYS+"개까지 유지할 수 있습니다. 한 수 되돌리기와 다시 시작을 사용할 수 있습니다.");
window.__KEYCAP__={press:k=>act("press",k),release:k=>act("release",k),restart:fresh,selectStage:n=>select(n-1),state:()=>({stage:ix+1,held:[...state.held],step:state.step,actions:state.actions,complete:state.done,solved:[...solved].map(i=>i+1)}),stages:()=>levels.map((l,i)=>({stage:i+1,title:l.title,start:[...l.start],goal:[...l.goal],keys:[...l.keys],actions:[...l.rules]}))};
fresh();
})();
</script>
</body></html>
